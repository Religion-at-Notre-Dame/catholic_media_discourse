<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Projector reel through the story, the Santiago map, the topic network, and misconception examples." />
  <title>Play · How the Americas Hear the Church · Notre Dame</title>
  <link rel="icon" type="image/svg+xml" href="../branding/nd-monogram.svg" />
  <link rel="stylesheet" href="../css/site.css" />
</head>
<body class="mode-present">
<main id="present">
  <iframe class="reel" id="reel" title="Projector reel" src="index.html#story"></iframe>
  <nav class="reel-pages" id="reel-pages" hidden>
    <a href="index.html">Story</a>
    <a href="findings.html">Findings</a>
    <a href="triage.html">Triage</a>
    <a href="methods.html">Methods</a>
    <a href="misconceptions.html">Misconceptions</a>
    <a href="language.html">Language</a>
    <a href="explore.html#/places">Places</a>
    <a href="explore.html#/topics">Topics</a>
    <a href="explore.html#/santiago">Santiago</a>
  </nav>
  <div class="reel-bar">
    <i class="reel-progress" id="reel-progress"></i>
    <strong id="reel-title">Story</strong>
    <span class="reel-caption" id="reel-caption"></span>
    <span class="reel-jumps" id="reel-jumps"></span>
    <button type="button" id="reel-pause">Pause</button>
    <button type="button" id="reel-again" hidden>Play again</button>
    <a class="reel-exit" id="reel-pages-btn" href="index.html">Site</a>
  </div>
</main>
<footer class="nd-footer" id="site-footer" hidden></footer>
<script src="../js/site.js" defer></script>
<script>
(function () {
  var scenes = [
    { src: "index.html#story", title: "Story", caption: "", full: true, ms: 52000 },
    { src: "explore.html#/santiago", title: "Santiago", caption: "", ready: ".leaflet-container", ms: 18000 },
    { src: "explore.html#/topics", title: "Topic network", caption: "", ready: "#graph svg", ms: 18000 },
    { src: "misconceptions.html", title: "Misconceptions", caption: "", full: true, ms: 52000 }
  ];
  var frame = document.getElementById("reel");
  var titleEl = document.getElementById("reel-title");
  var captionEl = document.getElementById("reel-caption");
  var stepEl = document.getElementById("reel-step");
  var bar = document.getElementById("reel-progress");
  var pauseBtn = document.getElementById("reel-pause");
  var againBtn = document.getElementById("reel-again");
  var jumps = document.getElementById("reel-jumps");
  var menu = document.getElementById("reel-pages");
  scenes.forEach(function (scene, n) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = scene.title;
    b.addEventListener("click", function () { go(n); });
    jumps.appendChild(b);
  });
  var i = 0;
  var ran = -1;
  var gen = 0;
  var timer = null;
  var scroller = 0;
  var paused = false;
  var cardTick = null;
  var remain = 0;
  var started = 0;
  function arm(ms) {
    remain = ms;
    started = Date.now();
    clearTimeout(timer);
    timer = setTimeout(function () { go(i + 1); }, ms);
  }

  function doc() {
    try { return frame.contentDocument; } catch (e) { return null; }
  }
  function clearTimers() {
    clearTimeout(timer);
    clearInterval(cardTick);
    scroller += 1;
  }
  function quiet(d) {
    if (!d || d.getElementById("reel-quiet")) return;
    var s = d.createElement("style");
    s.id = "reel-quiet";
    s.textContent = "html{scroll-behavior:auto !important}#cta-play{display:none !important}.nd-nav,.nd-footer{display:none !important}body{--nav-h:0px}body.mode-explore{height:100dvh}.hook{min-height:100dvh !important;padding-top:2.5rem}.mis-item.reel-hot{outline:3px solid #c99700;outline-offset:4px;background:#fff8e8}";
    d.head.appendChild(s);
  }
  function glide(d, scene, token) {
    var root = d.scrollingElement || d.documentElement;
    var win = frame.contentWindow;
    var t0 = null;
    var delay = 0;
    var endNow = Math.max(0, root.scrollHeight - win.innerHeight, (d.body && d.body.scrollHeight || 0) - win.innerHeight);
    var view = root.clientHeight || frame.clientHeight || 800;
    var pxPerSec = Math.max(84, view / 9);
    var dur = scene.full
      ? Math.max(12000, (endNow / pxPerSec) * 1000)
      : Math.max(8000, scene.ms - delay - 800);
    function tick(now) {
      if (token !== scroller) return;
      if (paused) { t0 = null; requestAnimationFrame(tick); return; }
      if (t0 == null) t0 = now;
      var elapsed = now - t0 - delay;
      if (elapsed < 0) { requestAnimationFrame(tick); return; }
      var target = scene.to && d.getElementById(scene.to);
      var end = target
        ? target.getBoundingClientRect().top + (win.scrollY || root.scrollTop) - 8
        : Math.max(0, root.scrollHeight - win.innerHeight, (d.body && d.body.scrollHeight || 0) - win.innerHeight);
      var p = Math.min(1, elapsed / dur);
      win.scrollTo(0, end * p);
      bar.style.width = (100 * p) + "%";
      if (p < 1) requestAnimationFrame(tick);
    }
    root.scrollTop = 0;
    requestAnimationFrame(tick);
    return delay + dur + 700;
  }
  function showCards(d) {
    var items = d.querySelectorAll("#mis-examples .mis-item");
    if (!items.length) { timer = setTimeout(function () { go(i + 1); }, 4000); return; }
    var k = 0;
    function step() {
      if (paused) return;
      for (var n = 0; n < items.length; n++) items[n].classList.remove("reel-hot");
      items[k].classList.add("reel-hot");
      var root = d.scrollingElement || d.documentElement;
      var top = items[k].getBoundingClientRect().top + root.scrollTop - 24;
      root.scrollTo({ top: top, behavior: "smooth" });
      bar.style.width = (100 * (k + 1) / items.length) + "%";
      k += 1;
      if (k >= items.length) timer = setTimeout(function () { go(i + 1); }, 8000);
    }
    step();
    cardTick = setInterval(function () {
      if (paused || k >= items.length) return;
      step();
    }, 8000);
  }
  function afterLoad(scene, token) {
    var d = doc();
    if (!d || token !== scroller || ran === token) return;
    ran = token;
    quiet(d);
    try { frame.contentWindow.dispatchEvent(new Event("resize")); } catch (e) {}
    function begin() {
      if (token !== scroller) return;
      var total = scene.ms;
      if (scene.to || scene.full) total = glide(d, scene, token);
      else if (scene.cards) showCards(d);
      else bar.style.width = "0%";
      if (!scene.cards) arm(total);
    }
    if (!scene.ready) { begin(); return; }
    var tries = 0;
    (function wait() {
      if (token !== scroller) return;
      if (d.querySelector(scene.ready) || tries > 40) begin();
      else { tries += 1; setTimeout(wait, 200); }
    })();
  }
  function markJumps() {
    var buttons = jumps.querySelectorAll("button");
    for (var n = 0; n < buttons.length; n++) buttons[n].classList.toggle("is-on", n === i);
  }
  function finish() {
    clearTimers();
    paused = true;
    pauseBtn.hidden = true;
    againBtn.hidden = false;
    titleEl.textContent = "End";
    captionEl.textContent = "";
    bar.style.width = "100%";
  }
  function go(n, keep) {
    if (n >= scenes.length) n = 0;
    if (n < 0) n = 0;
    clearTimers();
    paused = false;
    pauseBtn.hidden = false;
    pauseBtn.textContent = "Pause";
    againBtn.hidden = true;
    var token = scroller;
    i = n;
    var scene = scenes[i];
    titleEl.textContent = scene.title;
    captionEl.textContent = scene.caption;
    bar.style.width = "0%";
    markJumps();
    if (keep && doc()) { afterLoad(scene, token); return; }
    frame.onload = function () { afterLoad(scene, token); };
    frame.src = scene.src;
  }
  pauseBtn.addEventListener("click", function () {
    paused = !paused;
    pauseBtn.textContent = paused ? "Resume" : "Pause";
    if (scenes[i].cards) return;
    if (paused) {
      remain = Math.max(800, remain - (Date.now() - started));
      clearTimeout(timer);
    } else arm(remain);
  });
  againBtn.addEventListener("click", function () { go(0); });
  document.getElementById("reel-pages-btn").addEventListener("click", function (e) {
    e.preventDefault();
    menu.hidden = !menu.hidden;
  });
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.closest && e.target.closest(".reel-pages")) return;
    if (e.key === " ") { e.preventDefault(); pauseBtn.click(); }
    else if (e.key === "ArrowRight") go(i + 1);
    else if (e.key === "ArrowLeft") go(i - 1);
    else if (e.key === "Escape") window.location.href = "index.html";
  });
  function storyReady() {
    try {
      var d = doc();
      return d && d.readyState === "complete" && d.getElementById("storyboard") && frame.contentWindow.location.href.indexOf("index.html") !== -1;
    } catch (e) { return false; }
  }
  (function boot() {
    if (storyReady()) go(0, true);
    else setTimeout(boot, 150);
  })();
})();
</script>
</body>
</html>
